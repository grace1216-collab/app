<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Onething 歌库管理</title><style>html,body{margin:0;height:100%;background:#F7F6F4;font:16px system-ui;color:#211C17}#status{padding:28px;line-height:1.8}iframe{width:100%;height:100%;border:0;display:block}</style><div id="status">正在打开电脑端歌库管理…</div><script>
'use strict';
const patches=[["      '新增或修改诗歌都由歌库负责人在 Claude 里的 Onething Worship 完成，',\n", "      '新增或修改诗歌由歌库负责人在电脑端歌库管理编辑器完成，',\n"], ["  var MODE = G.claude ? 'cloud' : 'local';\n", "  var MODE = document.documentElement.hasAttribute('data-otw-editor') ? 'desktop' : (G.claude ? 'cloud' : 'local');\n"], ["    var html = (G.OTW_DEMO ? '\u003cdiv class=\"note note-local\">\u003cp>\u003cstrong>演示版\u003c/strong>：' + (typeof G.OTW_DEMO === 'string' ? esc(G.OTW_DEMO) : '在这里加歌、删歌、改团队名都只改这个演示页，不会动正式歌库，可以放心试。') + '\u003c/p>\u003c/div>' : '') +\n", "    var html = (MODE === 'desktop' ? '\u003cdiv class=\"note\">\u003cp>\u003cstrong>电脑端歌库管理\u003c/strong>\u003cbr>保存后只更新这台电脑的草稿，尚未发布到手机 App。完成整理后请保存完整编辑器备份，再导出发布包。完整备份含歌词与歌谱，双击即可继续编辑。\u003c/p>\u003c/div>' : '') + (G.OTW_DEMO ? '\u003cdiv class=\"note note-local\">\u003cp>\u003cstrong>演示版\u003c/strong>：' + (typeof G.OTW_DEMO === 'string' ? esc(G.OTW_DEMO) : '在这里加歌、删歌、改团队名都只改这个演示页，不会动正式歌库，可以放心试。') + '\u003c/p>\u003c/div>' : '') +\n"], ["      (MODE === 'cloud' ? '\u003cbutton type=\"button\" class=\"btn btn-small\" data-act=\"offline\">离线版\u003c/button>' : '') + '\u003c/div>\u003c/div>';\n", "      (MODE !== 'local' ? '\u003cbutton type=\"button\" class=\"btn btn-small\" data-act=\"offline\">导出发布包\u003c/button>' : '') + (MODE === 'desktop' ? '\u003cbutton type=\"button\" class=\"btn btn-small\" data-act=\"editor-backup\">保存完整编辑器备份\u003c/button>' : '') + '\u003c/div>\u003c/div>';\n"], ["    if (!artifactApi) { toast('这里不能保存修改，请在 Claude 里打开这个页面'); return; }\n", "    if (MODE === 'desktop') { saveDesktop(next, stash); return; }\n    if (!artifactApi) { toast('这里不能保存修改，请在 Claude 里打开这个页面'); return; }\n"], ["      case 'dl-html': downloadOfflineHtml(); break;\n", "      case 'editor-backup': downloadEditor(); break;\n      case 'dl-html': downloadOfflineHtml(); break;\n"], ["  /* ---------- start ---------- */\n", "\n  // Desktop drafts use IndexedDB because the songbook includes large score images.\n  var desktopDB = null, desktopRevision = 0;\n  function desktopNotice(message) {\n    var el = document.getElementById('desktop-status');\n    if (!el) {\n      el = document.createElement('p'); el.id = 'desktop-status';\n      el.style.cssText = 'padding:12px 20px;margin:0;background:#FBECDD;color:#663800;text-align:center';\n      el.setAttribute('role', 'status'); document.body.insertBefore(el, document.body.firstChild);\n    }\n    el.textContent = message;\n  }\n  function validDesktop(data) {\n    return data && Array.isArray(data.songs) && data.songs.every(function (s) {\n      return s && typeof s.id === 'string' && typeof s.title === 'string';\n    });\n  }\n  function initDesktop() {\n    setCanWrite(false); setBusy(true, '正在读取本机草稿…');\n    desktopNotice('正在读取本机草稿…');\n    var request;\n    try { request = indexedDB.open('onething-desktop-editor-v1', 1); }\n    catch (e) { desktopFailure(); return; }\n    request.onupgradeneeded = function () { request.result.createObjectStore('drafts'); };\n    request.onerror = desktopFailure;\n    request.onblocked = function () { desktopNotice('请关闭其他编辑器窗口，再刷新此页。'); };\n    request.onsuccess = function () {\n      desktopDB = request.result;\n      desktopDB.onversionchange = function () { desktopDB.close(); desktopFailure(); };\n      var read = desktopDB.transaction('drafts').objectStore('drafts').get('songbook');\n      read.onerror = desktopFailure;\n      read.onsuccess = function () {\n        var d = read.result;\n        if (d && !validDesktop(d)) { desktopFailure(); return; }\n        desktopRevision = d ? d.revision : 0;\n        if (d && d.built > bundle.built) {\n          S.songs = d.songs; resetEngine(S.songs);\n          desktopNotice('已恢复本机草稿 · ' + new Date(d.built).toLocaleString() + ' · 尚未发布');\n        } else desktopNotice('电脑端歌库管理 · 修改保存在本机，发布包需上传至原 App 仓库');\n        setBusy(false); setCanWrite(true); renderResults();\n      };\n    };\n  }\n  function desktopFailure() {\n    setBusy(false); setCanWrite(false);\n    desktopNotice('无法读取或保存本机草稿。请用普通模式的 Chrome 或 Edge 打开，允许网站存储后重试。现有歌库未被修改。');\n  }\n  function saveDesktop(next, stash) {\n    if (!desktopDB || !S.canWrite) return;\n    setBusy(true, '正在保存本机草稿…');\n    var tx = desktopDB.transaction('drafts', 'readwrite'), store = tx.objectStore('drafts');\n    var req = store.get('songbook'), conflict = false, now = Date.now(), revision;\n    req.onsuccess = function () {\n      var previous = req.result;\n      if ((previous ? previous.revision : 0) !== desktopRevision) { conflict = true; tx.abort(); return; }\n      revision = desktopRevision + 1;\n      store.put({songs: next, built: now, revision: revision}, 'songbook');\n    };\n    tx.oncomplete = function () {\n      desktopRevision = revision; setBusy(false); applyLocal(next, stash);\n      desktopNotice('草稿已保存 · ' + new Date(now).toLocaleString() + ' · 尚未发布到手机 App');\n    };\n    tx.onabort = function () {\n      setBusy(false);\n      toast(conflict ? '另一个窗口已保存新内容。请先复制当前填写内容，刷新后再修改，避免覆盖。' : '保存失败，可能存储空间不足。请保留此窗口并复制当前填写内容。');\n    };\n    tx.onerror = function () {};\n  }\n  function downloadEditor() {\n    if (S.busy || !S.canWrite) return;\n    var src = pageSource(); if (!src) return;\n    var html = offlineDocument(src, {v:2, built:Date.now(), songs:S.songs}, false)\n      .replace('\u003chtml lang=\"zh-CN\">', '\u003chtml lang=\"zh-CN\" data-otw-editor=\"1\">');\n    offerFile('Onething-Worship-电脑编辑器-' + dateStr() + '.html', new Blob([html], {type:'text/html'}), '完整编辑器备份已下载，包含歌词和歌谱，请妥善保存');\n  }\n\n  /* ---------- start ---------- */\n"], ["  } else {\n    Promise.all([use('artifact'), use('user')]).then(function (r) {\n", "  } else if (MODE === 'desktop') {\n    initDesktop();\n  } else {\n    Promise.all([use('artifact'), use('user')]).then(function (r) {\n"]];
(async function(){
 try {
  const response=await fetch('./index.html?editor='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('无法读取线上歌库');
  const doc=new DOMParser().parseFromString(await response.text(),'text/html');
  const script=doc.getElementById('app-js');
  if(!script||!doc.getElementById('songs-data'))throw new Error('线上歌库格式不匹配');
  let code=script.textContent;
  for(const [before,after] of (code.includes("function initDesktop()") && code.includes("data-otw-editor") ? [] : patches)){
   if(code.split(before).length!==2)throw new Error('App 版本已改变，请回到 Codex 更新编辑器适配。现有草稿仍保存在本机。');
   code=code.replace(before,()=>after);
  }
  script.textContent=code;
  doc.documentElement.setAttribute('data-otw-editor','1');
  doc.querySelectorAll('link[rel="manifest"],link[rel="icon"],link[rel="apple-touch-icon"]').forEach(el=>el.remove());
  const frame=document.createElement('iframe');frame.title='Onething 电脑端歌库管理';
  frame.srcdoc='<!doctype html>'+doc.documentElement.outerHTML;
  document.getElementById('status').remove();document.body.appendChild(frame);
 }catch(error){document.getElementById('status').textContent='编辑器暂时无法打开：'+error.message+' 请刷新重试；如仍失败，请回到 Codex 继续处理。';}
})();
</script></html>
